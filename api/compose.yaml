services:
  postgres:
    image: postgres:17-alpine
    container_name: zendent-postgres-local
    environment:
      POSTGRES_DB: zendent
      POSTGRES_USER: zendent
      POSTGRES_PASSWORD: zendent
    ports:
      - "5432:5432"
    volumes:
      - zendent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zendent -d zendent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zendent-postgres-data:

# Production profile. Every secret/connection value is env-injected —
# no default values, so a missing env var fails startup loudly instead
# of silently falling back to a dev secret.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USERNAME}
    password: ${DB_APP_PASSWORD}
  flyway:
    url: ${DB_URL}
    user: ${DB_OWNER_USERNAME}
    password: ${DB_OWNER_PASSWORD}
    placeholders:
      applicationRole: ${DB_APP_USERNAME}

zendent:
  jwt:
    secret: ${JWT_SECRET}
  tenant:
    base-domain: zendent.app
    dev-header-override-enabled: false
  cors:
    allowed-origin-patterns:
      # Every Clinic is its own origin, created at runtime, so the wildcard is
      # the only way to express this. The apex is listed for onboarding.
      - "https://*.zendent.app"
      - "https://zendent.app"

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

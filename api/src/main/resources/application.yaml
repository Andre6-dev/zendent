zendent:
  jwt:
    issuer: zendent
    # Short-lived on purpose: a stolen access token expires quickly, and the
    # refresh token (#24) is what buys a new one without re-entering a password.
    access-token-ttl: PT15M
    # Long enough that a person is not asked for a password daily, short enough
    # that an abandoned session eventually dies on its own.
    refresh-token-ttl: P30D
  invitation:
    # An invitation that stays redeemable forever is a permanent key to a Clinic
    # sitting in someone's inbox.
    ttl: P7D

spring:
  application:
    name: api
  flyway:
    enabled: true
    validate-on-migrate: true
  jpa:
    hibernate:
      # V1__init.sql (task 2.1.8) now creates event_publication (and the iam
      # tables), so Flyway fully owns the schema and Hibernate only needs to
      # validate against it — no more entities are mapped than what V1
      # creates until the iam JPA entities land in 2.2.1.
      ddl-auto: validate
  modulith:
    events:
      # Flyway owns the event_publication schema (design D6): V1__init.sql
      # creates the table with the exact DDL Hibernate's JPA entity expects,
      # so Modulith must not also try to initialize it. This property is
      # written for the spring-modulith-events-jdbc schema-init mechanism;
      # it is a documented no-op for the JPA-based repository this project
      # currently uses (spring-modulith-starter-jpa), kept here for design
      # fidelity (D6) and to avoid a silent double-init if a JDBC-based
      # event repository is ever adopted instead.
      jdbc:
        schema-initialization:
          enabled: false
      # Unprocessed event publications are retried on restart rather than
      # dropped (spec: "Event survives listener failure").
      republish-outstanding-events-on-restart: true
